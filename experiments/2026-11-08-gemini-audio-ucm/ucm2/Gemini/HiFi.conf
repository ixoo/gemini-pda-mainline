# SPDX-License-Identifier: MIT
# The speaker amplifiers take the headphone outputs, so both outputs use PCM 0 and
# Headphone Volume sets both levels. It stays at its minimum, -10 dB; volume is in
# software. See experiments/2026-11-08-gemini-audio-ucm.

SectionVerb {
	EnableSequence [
		cset "name='DAC In Mux' 'Normal Path'"
		cset "name='HPL Mux' 'Audio Playback'"
		cset "name='HPR Mux' 'Audio Playback'"
		cset "name='ADDA_DL_CH1 DL1_CH1' on"
		cset "name='ADDA_DL_CH2 DL1_CH2' on"
		cset "name='Headphone Volume' 0,0"
		cset "name='Speaker Switch' off"
		cset "name='Headphone Switch' off"
		cset "name='Main Mic Switch' off"
		cset "name='Back Mic Switch' off"
		cset "name='Headset Mic Switch' off"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"
	EnableSequence [
		cset "name='Speaker Switch' on"
	]
	DisableSequence [
		cset "name='Speaker Switch' off"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"
	EnableSequence [
		cset "name='Headphone Switch' on"
	]
	DisableSequence [
		cset "name='Headphone Switch' off"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		JackControl "Headphone Jack"
	}
}

# AIN0 and AIN2 as left and right. Both follow speech; which microphone each one is,
# is not established.
SectionDevice."Mic" {
	Comment "Mic"
	EnableSequence [
		cset "name='AIF Out Mux' 'Normal Path'"
		cset "name='UL1_CH1 ADDA_UL_CH1' on"
		cset "name='UL1_CH2 ADDA_UL_CH2' on"
		cset "name='ADC L Mux' 'Left Preamplifier'"
		cset "name='ADC R Mux' 'Right Preamplifier'"
		cset "name='PGA L Mux' AIN0"
		cset "name='PGA R Mux' AIN2"
		cset "name='PGA Volume' 3,3"
		cset "name='Main Mic Switch' on"
		cset "name='Back Mic Switch' on"
	]
	DisableSequence [
		cset "name='Main Mic Switch' off"
		cset "name='Back Mic Switch' off"
		cset "name='UL1_CH1 ADDA_UL_CH1' off"
		cset "name='UL1_CH2 ADDA_UL_CH2' off"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},3"
	}
}
