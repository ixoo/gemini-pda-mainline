# Test only: a filtered speaker sink for a live A/B on a card with the manual
# "gemini-headphones" sink (gemini-base 37). Drop it in the user's
# ~/.config/pipewire/pipewire.conf.d/ and restart PipeWire; it adds a sink,
# "Speaker (test filter)", feeding that sink. Remove the file to undo.
# A 4th-order Butterworth high-pass at 450 Hz (two biquads, Q 0.541 and 1.307):
# the speakers give little below 400 Hz and rattle at 200 Hz. A -4 dB cut at
# 1.6 kHz, their peak in the microphone sweep. "cap" scales the level, so that
# 100 % volume can be set to the loudest clean level once it is known.
context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Speaker (test filter)"
            media.name       = "Speaker (test filter)"
            filter.graph = {
                nodes = [
                    { type = builtin name = hp1 label = bq_highpass control = { "Freq" = 450.0 "Q" = 0.541 } }
                    { type = builtin name = hp2 label = bq_highpass control = { "Freq" = 450.0 "Q" = 1.307 } }
                    { type = builtin name = peak label = bq_peaking control = { "Freq" = 1600.0 "Q" = 1.0 "Gain" = -4.0 } }
                    { type = builtin name = cap label = mixer control = { "Gain 1" = 1.0 } }
                ]
                links = [
                    { output = "hp1:Out" input = "hp2:In" }
                    { output = "hp2:Out" input = "peak:In" }
                    { output = "peak:Out" input = "cap:In 1" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "effect_input.gemini_speaker"
                media.class = Audio/Sink
            }
            playback.props = {
                node.name     = "effect_output.gemini_speaker"
                node.passive  = true
                target.object = "gemini-headphones"
            }
        }
    }
]
