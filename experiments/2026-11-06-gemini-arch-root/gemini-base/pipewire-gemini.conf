# The Gemini's headphones as PipeWire's only sink (owner, 2026-11-08: Noctalia needs
# PipeWire). The card has no UCM profile or alsa-lib config, so this names the one routed
# PCM: device 0 (Playback_1, memory DL1), which gemini-audio's audio-start routes to the
# MT6351 headphone drivers. Playback_2/3 have no route, and the hostless PCMs are not for
# desktop audio. Speakers and capture stay off. The volume is PipeWire's software volume:
# the hardware Headphone Volume stays at audio-start's 0 (-10 dB), per the audio record
# (experiments/2026-11-01-gemini-audio-station). WirePlumber leaves the card itself alone
# (wireplumber-gemini.conf).
context.objects = [
    {   factory = adapter
        args = {
            factory.name     = api.alsa.pcm.sink
            node.name        = "gemini-headphones"
            node.description = "Headphones"
            media.class      = "Audio/Sink"
            api.alsa.path    = "hw:mt6797mt6351,0"
            audio.rate       = 48000
            audio.channels   = 2
            audio.position   = [ FL FR ]
        }
        # Without the card (gemini-audio failed), PipeWire still starts.
        flags = [ nofail ]
    }
]
