# The Gemini's audio card gets no automatic devices: its one usable output is defined in
# pipewire-gemini.conf, and the automatic profiles would open unrouted and hostless PCMs.
monitor.alsa.rules = [
    {
        matches = [
            { alsa.card_name = "~mt6797.*" }
            { api.alsa.card.name = "~mt6797.*" }
        ]
        actions = { update-props = { device.disabled = true } }
    }
]
