d /var/lib/gemini 0755 root root -
# A fixed console cursor, as on the station.
w- /sys/class/graphics/fbcon/cursor_blink - - - - 0
# UPower's charge-limit switch starts on, matching the kernel's boot limit of 80%. Created
# only when missing, so the user's later choice stays.
f /var/lib/upower/charging-threshold-status 0640 root root - 1
