# SPDX-License-Identifier: MIT
# Keep the kernel's keymap: the station's stage 1 loads the Gemini console map
# (gemini-us.bkeymap, with the Fn layer) on tty1 before the handover, and a keymap
# survives switch_root. KEYMAP=us replaced it with plain US, so the first-boot
# dialogue, the Wi-Fi passphrase included, had no Fn symbols (R4).
KEYMAP=@kernel
