# SPDX-License-Identifier: MIT
# The panel is portrait-native and used in landscape, as fbcon=rotate:3 does on
# the console. Both lines are to be checked on the device, not assumed.
output * transform 270
# 2160x1080 at about 400 dpi: scale 2 was a bit small (owner, R4); 2.5 gives an
# 864x432 desktop.
output * scale 2.5
input type:touch map_to_output *
# Gemian's Gemini layout, US until first boot writes 60-gemini-keyboard.conf with
# the owner's choice. Fn is the symbol layer; sway's Mod is Ctrl+Alt (sway-session).
input type:keyboard xkb_file /usr/share/gemini/xkb/us.xkb
# A column on the left instead of swaybar's top row (owner, R2): swaybar has no
# left or right position, so the default config's bar runs waybar instead.
# A text console without F-keys: Ctrl+Alt+Tab goes to tty2; there, Ctrl+Alt+1 or
# Alt+Left comes back.
bindsym Mod1+Control+Tab exec sudo -n /usr/bin/chvt 2
bar bar-0 swaybar_command /usr/lib/gemini/waybar-bar
