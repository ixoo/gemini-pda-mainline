# mpv's fast profile by default (owner, 2026-11-12). The default renderer's high-quality
# scalers saturate the Mali-T880: a 1080p30 H.264 clip dropped about half its frames
# fullscreen, against 2 of 300 with this profile, at the same picture apart from scaling.
profile=fast
# Hardware decoding through VA-API (the video decoder, libva-v4l2-request-mt6797), falling
# back to software per file when VA-API can't take a stream (owner, 2026-11-12).
hwdec=auto-safe
