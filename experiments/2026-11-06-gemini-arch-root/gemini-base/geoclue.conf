# SPDX-License-Identifier: MIT
# GeoClue's positions come from the GNSS receiver only (gnss-mt6797d's NMEA socket, set
# by its package's 90-gnss-mt6797.conf). The network sources are off, so no application's
# location request sends the device's address or nearby networks to an online service.
# Turn a source back on in a later conf.d file.
[ip]
enable=false

[wifi]
enable=false

[3g]
enable=false

[cdma]
enable=false

[modem-gps]
enable=false
