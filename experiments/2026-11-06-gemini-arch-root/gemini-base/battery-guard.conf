# battery-guard: power off cleanly when the battery voltage stays below MIN_UV (µV) on
# battery for three reads 10 s apart. 3.00 V from the fuel-gauge session: the MT6351 cuts
# the board off at its UVLO (2.60 V in the vendor kernel); load bursts between polls sag
# about 0.25 V further, and VSYS sits about 0.05 V under the battery. 3.30 V would power off
# a healthy battery under heavy use (3.48 V at 90 % in a browser session). Expected to move
# within 2.95-3.10 V once the fast-step resistance and the actual UVLO are measured.
MIN_UV=3000000
