# battery-guard: power off cleanly when the battery voltage stays below MIN_UV (µV) on
# battery for three reads 10 s apart. 3.10 V, the same on every Gemini (fuel-gauge session):
# the bootloader's 2.70 V hardware cut-off (UVLO), plus 0.25 V for load bursts between polls,
# 0.05 V across the BATFET to VSYS, and a 0.10 V margin. The adaptive gauge reaches 0 % at
# 0.10 V above this, so the guard only catches what the gauge misses.
MIN_UV=3100000
