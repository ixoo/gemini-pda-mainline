[General]
# networkd configures addresses.
EnableNetworkConfiguration=false
# The driver has only run with its own address; randomisation is untested.
AddressRandomization=disabled

[Scan]
DisableMacAddressRandomization=true

[Network]
NameResolvingService=systemd

# Keep mac80211's default netdev instead of creating iwd's own (2026-11-14): after each
# suspend the radio modules reload, and iwd's replacement took the next free name while the
# default one still held wlan0, so the name climbed (wlan4 after four cycles).
[DriverQuirks]
DefaultInterface=*
