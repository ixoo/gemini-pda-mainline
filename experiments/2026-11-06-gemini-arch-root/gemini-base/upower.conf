# UPower's critical action: a clean poweroff (owner, 2026-11-11). UPower's Auto picks Sleep
# when the system can suspend, and suspend isn't reliable on the Gemini yet, so at the
# critical level it would drain on. UPower's own percentages stay (20/5/2 %): with the
# adaptive gauge, 0 % means the battery is about to reach the cut-off.
[UPower]
CriticalPowerAction=PowerOff
