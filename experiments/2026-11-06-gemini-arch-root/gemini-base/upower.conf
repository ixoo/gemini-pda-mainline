# The Gemini's low-battery policy (owner, 2026-11-11). Under load the original cell sags about
# 0.7 V below its open-circuit voltage at 1.8 A, so heavy use near empty can brown out before
# UPower's stock 2 % action. UPower: "low" at 20 %, "critical" at 12 %, and a clean poweroff
# at 8 %. battery-guard adds a voltage backstop, which UPower lacks.
[UPower]
PercentageLow=20.0
PercentageCritical=12.0
PercentageAction=8.0
CriticalPowerAction=PowerOff
