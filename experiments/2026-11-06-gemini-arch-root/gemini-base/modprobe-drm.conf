# SPDX-License-Identifier: MIT
# modprobe@drm needs gemini-modules' index: run in parallel, `modprobe -q drm` found no
# modules.dep and loaded nothing (R5). systemd-logind waits for modprobe@drm so that its
# DeviceAllow=char-drm resolves; without drm registered, logind's own open of
# /dev/dri/card0 failed with EPERM and sway never got the display.
[Unit]
After=gemini-modules.service
