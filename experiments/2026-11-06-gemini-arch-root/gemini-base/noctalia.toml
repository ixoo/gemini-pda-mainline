# The Gemini's Noctalia defaults, copied to each new user's ~/.config/noctalia/ at first
# boot. Noctalia merges that directory's *.toml files in name order, so the user's own
# config.toml, and settings changed in Noctalia, override these.

# A vertical bar on the left edge (owner, 2026-11-08), using the full height:
# Noctalia's default 100 px end margins left about 230 of the then 432 px for eight widgets.
# Tried live on card-18; owner: "Keep it". The session panel stays on Ctrl+Alt+Backspace
# and in the control center.
[bar.default]
position = "left"
margin_ends = 0
margin_edge = 0
radius = 0
thickness = 40
padding = 8
widget_spacing = 10
# Bar text at 1.3 (owner, 2026-11-08); the clock scales its own text on top.
font_scale = 1.3
start  = ["launcher", "workspaces"]
center = ["clock"]
end    = ["network", "bluetooth", "volume", "battery", "control-center"]

[widget.clock]
vertical_format = "{:%H\n%M}"
tooltip_format = "{:%A %d %B}"
font_scale = 1.3
font_weight = 700

# A vertical bar can't show the percent label, so the level is drawn as a fill.
[widget.battery]
display_mode = "graphic"

# Icons only (owner, 2026-11-08: "don't display the network name, icon is enough", "don't
# display the volume value"), and bigger, to fill the 40 px width (scale 1.6, tried live on
# card-23); the battery keeps its size. Bluetooth's widget shows only while bluez runs:
# with bluetooth.service stopped there is no adapter on D-Bus, and the widget hides itself.
[widget.launcher]
scale = 1.6

[widget.network]
show_label = false
scale = 1.6

[widget.bluetooth]
show_label = false
scale = 1.6

[widget.volume]
show_label = false
scale = 1.6

[widget.control-center]
scale = 1.6

# The launcher (Ctrl+Alt+Space or the side key) as a plain search field over one list,
# macOS-like (owner, 2026-11-08). The simple layout is 560x500; Noctalia clamps it to the
# 470 px screen. No category chips, origin badges or larger rows.
[shell.launcher]
layout = "simple"
categories = false
compact = true
show_app_origin_indicator = false

# Display brightness (owner, 2026-11-08: "the display brightness should work"). The PWM
# backlight is a platform device with no link to the DSI connector, so Noctalia can't match
# /sys/class/backlight/backlight to an output on its own; name it here. Noctalia writes
# through logind's SetBrightness.
[brightness.monitor.DSI-1]
backlight_device = "backlight"

# The GPS switch (owner, 2026-11-10: GNSS "only when activated in noctalia"): the GNSS
# package's plugin, gemini/gnss, from its path source, as a control-center tile. Listing
# plugin sources or shortcuts replaces Noctalia's defaults, so the default sources stay
# listed. The Home tab shows six tiles: the defaults without the power-profile tile, since
# the card has no power-profiles-daemon, and with GPS after Bluetooth.
[plugins]
enabled = ["gemini/gnss"]

[[plugins.source]]
name = "official"
kind = "git"
location = "https://github.com/noctalia-dev/official-plugins"
enabled = true

[[plugins.source]]
name = "community"
kind = "git"
location = "https://github.com/noctalia-dev/community-plugins"
enabled = true

[[plugins.source]]
name = "gemini"
kind = "path"
location = "/usr/share/noctalia/plugins"
enabled = true

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "gemini/gnss:toggle"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"
