# The Gemini's Noctalia defaults, copied to each new user's ~/.config/noctalia/ at first
# boot. Noctalia merges that directory's *.toml files in name order, so the user's own
# config.toml, and settings changed in Noctalia, override these.

# A vertical bar on the left edge (owner, 2026-11-08), using the full height:
# Noctalia's default 100 px end margins left about 230 of the 432 px for eight widgets.
# Tried live on card-18; owner: "Keep it". The session panel stays on Ctrl+Alt+Backspace
# and in the control center.
[bar.default]
position = "left"
margin_ends = 0
margin_edge = 0
radius = 0
thickness = 40
padding = 8
widget_spacing = 10
font_scale = 1.15
start  = ["launcher", "workspaces"]
center = ["clock"]
end    = ["network", "bluetooth", "volume", "battery", "control-center"]

[widget.clock]
vertical_format = "{:%H\n%M}"
tooltip_format = "{:%A %d %B}"
font_scale = 1.3
font_weight = 700

# A vertical bar can't show the percent label, so the level is drawn as a fill.
[widget.battery]
display_mode = "graphic"

# Icons only (owner, 2026-11-08: "don't display the network name, icon is enough", "don't
# display the volume value"). Bluetooth's widget shows only while bluez runs: with
# bluetooth.service stopped there is no adapter on D-Bus, and the widget hides itself.
[widget.network]
show_label = false

[widget.bluetooth]
show_label = false

[widget.volume]
show_label = false

# The launcher (Ctrl+Alt+Space or the side key) as a plain search field over one list,
# macOS-like (owner, 2026-11-08). The simple layout is 560x500; Noctalia clamps it to the
# 432 px screen. No category chips, origin badges or larger rows.
[shell.launcher]
layout = "simple"
categories = false
compact = true
show_app_origin_indicator = false
