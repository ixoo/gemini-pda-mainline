# Closing the lid suspends, on battery only (power-management session, 2026-11-10). The
# sleep hook gemini-radios unloads the connectivity radios first; the kernel refuses a
# suspend while they are loaded, and while a charger is attached (0630). The gemini-lid
# module also blanks the panel and stops the keyboard while the lid is closed.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
