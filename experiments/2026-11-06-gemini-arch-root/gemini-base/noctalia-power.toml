# Fewer wakeups on battery (owner, 2026-11-13). first-login links this file into each user's
# ~/.config/noctalia once; remove the link to drop these settings, or override them in a
# later-named file or the settings window.

# The Caps/Num/Scroll Lock OSD polls every 200 ms (5 wakeups/s, screen on or off). It reads
# input LEDs named *::capslock, which the Gemini's matrix keyboard doesn't have (its caps lock
# LED is red:indicator-7), and otherwise Noctalia sees the lock state only while it has
# keyboard focus, so the OSD could not follow it anyway.
[osd.kinds]
lock_keys = false

# The system monitor samples whether or not anything shows its figures, about one wakeup/s at
# the defaults (2/2/3/5/10 s). Every 10 s keeps the control centre's System tab useful. No GPU
# reader exists for the Mali, so GPU sampling is off.
[system.monitor]
cpu_poll_seconds = 10.0
memory_poll_seconds = 10.0
network_poll_seconds = 10.0
gpu_poll_seconds = 0.0
disk_poll_seconds = 30.0
