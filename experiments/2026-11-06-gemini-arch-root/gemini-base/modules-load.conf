# Loaded at boot, as on the station: the lid policy, the indicator LEDs (caps
# lock on the inside LED) and the vibration motor as an idle input device.
gemini-lid
leds-aw9120
regulator-haptic
# Gates the infra clocks nothing on the Gemini uses (cpuidle G1, G2: about 2.8 mA blanked, every
# function intact, rmmod restores the bits; 2026-11-13). Card only for now.
mt6797-gate-unused
# The SPM's SODI idle state (cpuidle session, daily use, 2026-11-24); gemini-sodi.service
# enables it. Loading it also makes "deep" the kernel's default sleep, so sleep.conf's
# MemorySleepMode=s2idle stays.
mt6797-spm-sleep
