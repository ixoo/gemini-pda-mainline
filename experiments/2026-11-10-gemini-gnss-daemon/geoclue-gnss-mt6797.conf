# SPDX-License-Identifier: MIT
# GeoClue's NMEA source reads the Gemini's GNSS fixes from gnss-mt6797d's socket. GeoClue
# connects as a client and retries every 5 s while the socket is absent, so this works
# whether or not gnss-mt6797.service is running.
[network-nmea]
enable=true
nmea-socket=/run/gnss-mt6797/nmea.sock
