%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/mediatek/mediatek,mt6797-a72-platform-provider-clock-observer.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT6797 Cortex-A72 platform, provider, and clock observer

maintainers:
  - Gemini Mainline Experiment <gemini-mainline@example.invalid>

description: |
  Candidate-only observer for one stable platform snapshot, one stable
  read-only DA921x provider snapshot, and one bounded protected-clock snapshot.
  The final operation uses the existing handoff-owned CSPM protocol but does not
  own or request CPU state.

properties:
  compatible:
    const: mediatek,mt6797-a72-platform-provider-clock-observer

  mediatek,platform-state:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the bound MT6797 A72 platform-state source.

  mediatek,provider:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the bound exact DA9214 legacy provider endpoint.

  mediatek,clock-backend:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Phandle to the bound MT6797 protected-clock backend.

required:
  - compatible
  - mediatek,platform-state
  - mediatek,provider
  - mediatek,clock-backend

additionalProperties: false

examples:
  - |
    a72-platform-provider-clock-observer {
        compatible = "mediatek,mt6797-a72-platform-provider-clock-observer";
        mediatek,platform-state = <&a72_platform_state>;
        mediatek,provider = <&da9214>;
        mediatek,clock-backend = <&dvfsp_clock_backend>;
    };
